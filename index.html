<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lon Stratton Contact</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root {
  --bg: #000;
  --text: #ffb400;
  --subtle: #9aa0a6;
  --accent: #ccc;
  --rule: #414141;
}
body {
  margin: 0 2em;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100vh;
  display: grid;
  justify-items: center;
  align-items: start;
  -webkit-font-smoothing: antialiased;
}
main {
  width: 100%;
  max-width: 720px;
  padding: 4rem 2rem 3rem;
}
.site-title {
  margin: 0 0 1.5rem;
  font-size: 2.2em;
  font-weight: 500;
  letter-spacing: -0.06em;
  line-height: 1.1;
}
.site-title .title-light {
  font-weight: 100;
  letter-spacing: -0.06em;
  padding-right: 0.04em;
}
.h1-sub {
  display: block;
  margin: 0.2em 0 0;
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--subtle);
  letter-spacing: -0.01em;
  text-transform: uppercase;
}
hr {
  border: none;
  border-top: 1px solid var(--rule);
  margin: 0 0 1.5rem;
}
.section {
  margin-bottom: 1.3rem;
}
.section-title {
  font-weight: 600;
  font-size: .9rem;
  margin-bottom: 0.3rem;
  color: var(--text);
}
.section a {
  font-size: 0.8rem;
  font-weight: 200;
}
a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.15s ease;
}
a:hover {
  color: #00a700;
}
.website {
  display: block;
  margin-top: 0.25rem;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.website:hover {
  text-decoration: underline;
}
</style>
</head>
<body>
<main>
<h1 class="site-title">
  <span class="title-light">LON</span>STRATTON
  <span class="h1-sub">Direct contact information</span>
</h1>
<hr>
<div class="section">
  <div class="section-title">Lon - Personal</div>
  <a href="mailto:lon@stratton.contact">lon@stratton.contact</a>
</div>
<div class="section">
  <div class="section-title">Lon - Stratton Camera</div>
  <a href="mailto:lon@strattoncamera.com">lon@strattoncamera.com</a>
  <a class="website" href="https://strattoncamera.com">Website</a>
</div>
<div class="section">
  <div class="section-title">Cinematography</div>
  <a href="mailto:lon@lonstratton.com">lon@lonstratton.com</a>
  <a class="website" href="https://lonstratton.com">Website</a>
</div>
<div class="section">
  <div class="section-title">Aviation</div>
  <a href="mailto:lon@n7xa.com">lon@n7xa.com</a>
  <a class="website" href="https://n7xa.com">Website</a>
</div>
<hr>
</main>
</body>
</html>
